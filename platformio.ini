; PlatformIO Project Configuration File
;
; Vakitmatik P4 LED Panel Projesi
; ESP32-S3 N16R8 (16MB Flash, 8MB PSRAM)
; 18 adet P4 Panel (80x40) - 240x240 toplam çözünürlük
; 1/10 Scan, ICN2037BP Sürücü
;
; Müşteri: Umutcan Yılmaz
; Geliştirici: Veysel Karani Kılıçerkan
;
; ORTAM SEÇİMİ:
;   single-panel-test  → Tek panel ile test (MÜŞTERİ BURAYA PIN GİRMELİ)
;   esp32-s3-devkitc-1 → 18 panel tam prod konfigürasyonu

; ============================================================================
; PAYLAŞILAN AYARLAR
; ============================================================================
[common]
lib_deps = 
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.0
    arduino-libraries/NTPClient @ ^3.2.1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

common_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DCONFIG_SPIRAM_USE_MALLOC
    -DPANEL_WIDTH=80
    -DPANEL_HEIGHT=40

; ============================================================================
; ORTAM 1: SCAN TANILAMA (ŞU AN KULLANILABİLİR)  ← MÜŞTERİ BU ORTAMI KULLANIYOR
; ============================================================================
; Bu ortam examples/01_ScanDiagnostic/ içindeki programı yükler.
; Farklı driver konfigürasyonlarını otomatik olarak dener ve
; her konfigürasyonda Row Scan + Renk + Çerçeve + Büyük-L testlerini yapar.
;
; !!! COM PORT'u değiştirin (Aygıt Yöneticisi'nden bakın) !!!
; !!! PIN numaralarını kendi boardunuza göre değiştirin    !!!

[env:scan-diagnostic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_speed = ${common.upload_speed}
upload_port = COM3  ; <-- BUNU DEĞİŞTİRİN (örn: COM4, COM5...)

; PlatformIO'ya farklı kaynak klasörü söyle
build_src_filter = -<*> +<../examples/01_ScanDiagnostic/>

build_flags =
    ${common.common_flags}
    ; === PIN TANIMLARI - KENDİ PINI İLE DEĞİŞTİRİN ===
    ; (platformio.ini'deki bu tanımlar artık kullanılmıyor,
    ;  pin'ler doğrudan .ino dosyasına yazıldı — değişiklik için orada değiştirin)
    -DPANELS_X=1
    -DPANELS_Y=1

; ============================================================================
; ORTAM 2: TEK PANEL TEST (PINLER ONAYLANDIKTAN SONRA)
; ============================================================================
[env:single-panel-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_speed = ${common.upload_speed}
upload_port = COM3  ; <-- BUNU DEĞİŞTİRİN (örn: COM4, COM5...)

build_flags =
    ${common.common_flags}
    ; === PIN TANIMLARI - Umutcan ESP32S3 Dev Module ===
    -DR1_PIN=8
    -DG1_PIN=9
    -DB1_PIN=10
    -DR2_PIN=14
    -DG2_PIN=12
    -DB2_PIN=13
    -DA_PIN=20
    -DB_PIN=21
    -DC_PIN=5
    -DD_PIN=17
    -DE_PIN=-1
    -DLAT_PIN=4
    -DOE_PIN=15
    -DCLK_PIN=16
    ; === TEK PANEL KONFİGÜRASYONU ===
    -DPANELS_X=1
    -DPANELS_Y=1

; ============================================================================
; ORTAM 2: 18 PANEL TAM KONFİGÜRASYON  ← PROD
; ============================================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_speed = ${common.upload_speed}
upload_port = COM3  ; Windows için - müşteri bunu değiştirecek

build_flags =
    ${common.common_flags}
    ; HUB75 Pin Tanımlamaları - Umutcan ESP32S3 Dev Module
    -DR1_PIN=8
    -DG1_PIN=9
    -DB1_PIN=10
    -DR2_PIN=14
    -DG2_PIN=12
    -DB2_PIN=13
    -DA_PIN=20
    -DB_PIN=21
    -DC_PIN=5
    -DD_PIN=17
    -DE_PIN=-1
    -DLAT_PIN=4
    -DOE_PIN=15
    -DCLK_PIN=16
    ; 18 Panel Konfigürasyonu
    -DPANELS_X=3
    -DPANELS_Y=6

; Debug Ayarları (opsiyonel)
; debug_tool = esp-builtin
; debug_init_break = tbreak setup
